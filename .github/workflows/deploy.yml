name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build (static export)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # Pin an explicit Wrangler. The action's default is 3.90.0, which
          # predates JSONC config support and therefore cannot read
          # `wrangler.jsonc` at all — it fails with "Missing entry-point"
          # because it never sees the `main` field. Every deploy since
          # 2026-08-16 failed for this reason.
          wranglerVersion: "4.127.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a0365f6aaae5fe32b3fdb8fa08fd000c
