name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build (static export)
        run: npm run build

      # Read-only pre-flight. Without this, a wrong or missing account id does
      # not fail loudly — `wrangler deploy` happily CREATES a brand-new Worker
      # of the same name in whichever account the token can reach, leaving the
      # real one stale while everything appears to succeed.
      - name: Verify Cloudflare account and Worker identity
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: a0365f6aaae5fe32b3fdb8fa08fd000c
          CF_SCRIPT_NAME: uk-utility-tools
        run: |
          set -uo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_API_TOKEN" "$@"; }

          echo "1. Verifying the API token"
          verify=$(api "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if [ "$(jq -r '.success' <<<"$verify")" != "true" ]; then
            echo "::error::API token failed verification."
            jq -c '.errors' <<<"$verify"
            exit 1
          fi
          echo "   token status: $(jq -r '.result.status' <<<"$verify")"

          echo "2. Accounts this token can reach"
          accounts=$(api "https://api.cloudflare.com/client/v4/accounts")
          if [ "$(jq -r '.success' <<<"$accounts")" = "true" ]; then
            jq -r '.result[] | "   - \(.name)  id=\(.id)"' <<<"$accounts"
          else
            echo "   (account list unavailable to this token: $(jq -c '.errors' <<<"$accounts"))"
          fi

          echo "3. Does the configured account contain the Worker?"
          scripts=$(api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts")
          if [ "$(jq -r '.success' <<<"$scripts")" != "true" ]; then
            echo "::error::Token cannot read account $CF_ACCOUNT_ID."
            jq -c '.errors' <<<"$scripts"
            exit 1
          fi
          if ! jq -e --arg n "$CF_SCRIPT_NAME" '.result[]? | select(.id == $n)' <<<"$scripts" >/dev/null; then
            echo "::error::Worker $CF_SCRIPT_NAME is NOT in account $CF_ACCOUNT_ID. Refusing to deploy."
            echo "   Workers present in this account:"
            jq -r '.result[]?.id | "   - \(.)"' <<<"$scripts"
            exit 1
          fi
          echo "   OK: $CF_SCRIPT_NAME exists in account $CF_ACCOUNT_ID."

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # Pin an explicit Wrangler. The action's default is 3.90.0, which
          # predates JSONC config support and therefore cannot read
          # `wrangler.jsonc` at all — it fails with "Missing entry-point"
          # because it never sees the `main` field. Every deploy since
          # 2026-08-16 failed for this reason.
          wranglerVersion: "4.127.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a0365f6aaae5fe32b3fdb8fa08fd000c
